<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbi3</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Arbi3</h1>
      <p>USDT perpetual futures · покупка ask → продажа bid</p>
    </div>
    <div id="connection" class="status offline">offline</div>
  </header>

  <section class="controls">
    <label>
      Режим
      <select id="mode">
        <option value="all">Все активы</option>
        <option value="favorites">Только избранные</option>
      </select>
    </label>
    <label>
      Интервал
      <select id="interval">
        <option value="250">250 мс</option>
        <option value="500">500 мс</option>
        <option value="1000">1 сек</option>
        <option value="2000">2 сек</option>
        <option value="5000">5 сек</option>
        <option value="10000">10 сек</option>
      </select>
    </label>
    <label class="grow">
      Поиск
      <input id="search" type="search" placeholder="BTC, ETH...">
    </label>
    <details class="column-picker">
      <summary>Колонки</summary>
      <div class="column-picker-menu">
        <label><input type="checkbox" data-column-toggle="favorite"> Избранное</label>
        <label><input type="checkbox" data-column-toggle="symbol"> Актив</label>
        <label><input type="checkbox" data-column-toggle="binance"> Binance</label>
        <label><input type="checkbox" data-column-toggle="bybit"> Bybit</label>
        <label><input type="checkbox" data-column-toggle="current"> Текущая</label>
        <label><input type="checkbox" data-column-toggle="hour-max"> Макс. 1 час</label>
        <label><input type="checkbox" data-column-toggle="hour-min"> Мин. 1 час</label>
        <label><input type="checkbox" data-column-toggle="day-max"> Макс. 24 часа</label>
        <label><input type="checkbox" data-column-toggle="day-min"> Мин. 24 часа</label>
        <label><input type="checkbox" data-column-toggle="all-time-max"> Макс. всё время</label>
        <label><input type="checkbox" data-column-toggle="all-time-min"> Мин. всё время</label>
        <label><input type="checkbox" data-column-toggle="direction"> Направление</label>
      </div>
    </details>
    <button id="theme" type="button">Тема</button>
  </section>

  <main>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-column="favorite" class="align-left">★</th>
            <th data-column="symbol" class="align-left sortable" data-sort-key="symbol">
              <button type="button">Актив <span class="sort-indicator"></span></button>
            </th>
            <th data-column="binance" class="sortable" data-sort-key="binance">
              <button type="button">Binance <span class="sort-indicator"></span></button>
            </th>
            <th data-column="bybit" class="sortable" data-sort-key="bybit">
              <button type="button">Bybit <span class="sort-indicator"></span></button>
            </th>
            <th data-column="current" class="sortable" data-sort-key="current">
              <button type="button">Текущая <span class="sort-indicator"></span></button>
            </th>
            <th data-column="hour-max" class="sortable" data-sort-key="hour_max">
              <button type="button">Макс. 1 час <span class="sort-indicator"></span></button>
            </th>
            <th data-column="hour-min" class="sortable" data-sort-key="hour_min">
              <button type="button">Мин. 1 час <span class="sort-indicator"></span></button>
            </th>
            <th data-column="day-max" class="sortable" data-sort-key="day_max">
              <button type="button">Макс. 24 часа <span class="sort-indicator"></span></button>
            </th>
            <th data-column="day-min" class="sortable" data-sort-key="day_min">
              <button type="button">Мин. 24 часа <span class="sort-indicator"></span></button>
            </th>
            <th data-column="all-time-max" class="sortable" data-sort-key="all_time_max">
              <button type="button">Макс. всё время <span class="sort-indicator"></span></button>
            </th>
            <th data-column="all-time-min" class="sortable" data-sort-key="all_time_min">
              <button type="button">Мин. всё время <span class="sort-indicator"></span></button>
            </th>
            <th data-column="direction" class="sortable" data-sort-key="direction">
              <button type="button">Направление <span class="sort-indicator"></span></button>
            </th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <template id="row-template">
    <tr>
      <td data-column="favorite" class="align-left"><button class="favorite" type="button">☆</button></td>
      <td data-column="symbol" class="symbol align-left"></td>
      <td data-column="binance" class="binance price"></td>
      <td data-column="bybit" class="bybit price"></td>
      <td data-column="current" class="current delta"></td>
      <td data-column="hour-max" class="hour-max delta"></td>
      <td data-column="hour-min" class="hour-min delta"></td>
      <td data-column="day-max" class="day-max delta"></td>
      <td data-column="day-min" class="day-min delta"></td>
      <td data-column="all-time-max" class="all-time-max delta"></td>
      <td data-column="all-time-min" class="all-time-min delta"></td>
      <td data-column="direction" class="direction"></td>
    </tr>
  </template>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
